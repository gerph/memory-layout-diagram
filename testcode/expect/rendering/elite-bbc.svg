        text {
            font-family: Optima, Rachana, Sawasdee, sans-serif;
        }
    </style>
</defs>
<g transform="matrix(1.000000 0.000000 0.000000 1.000000 12.000000 12.000000)">
  <rect x="-0.125in" y="-0.125in" width="4.605in" height="12.375in" fill="#000"/>
  <rect x="0in" y="0in" width="2.750in" height="0.750in" fill="#000" stroke="#90EE90" stroke-width="0.028in"/>
  <rect x="0in" y="0.750in" width="2.750in" height="0.750in" fill="#000" stroke="#90EE90" stroke-width="0.028in"/>
  <rect x="0in" y="1.500in" width="2.750in" height="0.500in" fill="#000" stroke="#90EE90" stroke-width="0.028in"/>
